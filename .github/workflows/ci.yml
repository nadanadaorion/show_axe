name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck:tests
      - run: npm run build
      - run: npm run check:secrets

  # Runs the real Supabase-backed integration/E2E suites against a local
  # `supabase start` stack. This needs Docker pulling images from Docker
  # Hub/ghcr.io, which GitHub-hosted runners can do (unlike some sandboxed
  # dev environments) — see docs/19-TESTING_STRATEGY.md for the equivalent
  # local workflow and supabase/scripts/verify-sql-native.sh for a
  # Docker-free fallback that checks the migrations/RPCs directly.
  supabase-integration:
    runs-on: ubuntu-latest
    env:
      # After `supabase start`, a missing/unreachable config must fail the
      # suites loudly instead of skipping — see tests/integration/env.ts.
      SUPABASE_INTEGRATION_REQUIRED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Export local Supabase connection details
        run: |
          # `supabase status` output is well-known, non-secret local dev
          # defaults (the CLI's own banner: "API keys and JWT secrets are shared
          # defaults. Do not use in production"), so printing it is safe and is
          # exactly what makes a future field-name change fail loudly instead of
          # silently exporting an empty value.
          #
          # This CLI version's default `-o env` output does not include the
          # anon/publishable key at all (confirmed by dumping it in CI: only
          # API_URL, DB_URL, GRAPHQL_URL, INBUCKET_URL, MAILPIT_URL, MCP_URL,
          # REST_URL, STUDIO_URL). `--override-name` can force specific fields
          # to be included under a chosen var name, and `-o json` exposes the
          # full status object as a fallback if the field name guess is wrong.
          STATUS_ENV="$(supabase status -o env \
            --override-name anon_key=CLI_ANON_KEY \
            --override-name publishable_key=CLI_PUBLISHABLE_KEY \
            --override-name api.anon_key=CLI_API_ANON_KEY \
            --override-name service_role_key=CLI_SERVICE_ROLE_KEY \
            --override-name secret_key=CLI_SECRET_KEY \
            --override-name api.service_role_key=CLI_API_SERVICE_ROLE_KEY)"
          echo "$STATUS_ENV"
          echo "--- full JSON status (fallback source) ---"
          STATUS_JSON="$(supabase status -o json)"
          echo "$STATUS_JSON"

          extract_env() {
            for name in "$@"; do
              value="$(echo "$STATUS_ENV" | grep -m1 "^${name}=" | cut -d= -f2- | tr -d '"')"
              if [ -n "$value" ]; then echo "$value"; return 0; fi
            done
            return 1
          }
          extract_json() {
            for name in "$@"; do
              value="$(echo "$STATUS_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);const v=('$name'.split('.').reduce((o,k)=>o&&o[k],j));if(v)console.log(v)}catch(e){}})")"
              if [ -n "$value" ]; then echo "$value"; return 0; fi
            done
            return 1
          }

          URL="$(extract_env API_URL SUPABASE_API_URL SUPABASE_URL || extract_json api_url url API_URL)"
          KEY="$(extract_env CLI_ANON_KEY CLI_PUBLISHABLE_KEY CLI_API_ANON_KEY ANON_KEY PUBLISHABLE_KEY SUPABASE_ANON_KEY SUPABASE_PUBLISHABLE_KEY \
            || extract_json anon_key publishable_key api.anon_key api.publishable_key ANON_KEY PUBLISHABLE_KEY)"

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Could not extract API URL/anon-or-publishable key from 'supabase status' (dumped above in both env and json form). The CLI's field names changed again — update the candidate list in this step using the JSON dump above."
            exit 1
          fi

          echo "SUPABASE_TEST_URL=$URL" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_ANON_KEY=$KEY" >> "$GITHUB_ENV"

          DB="$(extract_env DB_URL SUPABASE_DB_URL || extract_json db_url DB_URL)"
          SERVICE_KEY="$(extract_env CLI_SERVICE_ROLE_KEY CLI_SECRET_KEY CLI_API_SERVICE_ROLE_KEY SERVICE_ROLE_KEY SECRET_KEY SUPABASE_SERVICE_ROLE_KEY \
            || extract_json service_role_key secret_key api.service_role_key SERVICE_ROLE_KEY)"
          if [ -z "$DB" ] || [ -z "$SERVICE_KEY" ]; then
            echo "::error::Could not extract DB URL/service-role key from 'supabase status' (dumped above). Update the candidate list in this step using the JSON dump."
            exit 1
          fi
          echo "SUPABASE_TEST_DB_URL=$DB" >> "$GITHUB_ENV"
          echo "::add-mask::$SERVICE_KEY"
          echo "SUPABASE_TEST_SERVICE_KEY=$SERVICE_KEY" >> "$GITHUB_ENV"
      - name: Create the authorised E2E account
        # D-215: the editor requires a session, so the suites need a real account. This is the local
        # CLI stack's throwaway database, seeded from empty on every run, and the service-role key
        # here is the CLI's well-known local default — it never leaves the runner and is never a
        # production credential.
        #
        # An account that authenticates but is not a member of orion_app_users would pass login and
        # then be denied by every policy, so both halves are done here and verified below.
        run: |
          set -euo pipefail
          EMAIL="e2e@orion.test"
          PASSWORD="$(head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 32)"
          echo "::add-mask::$PASSWORD"

          CREATED="$(curl -sS -X POST "${SUPABASE_TEST_URL%/}/auth/v1/admin/users" \
            -H "apikey: $SUPABASE_TEST_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_TEST_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"email_confirm\":true}")"
          if ! echo "$CREATED" | grep -q '"id"'; then
            echo "::error::Could not create the E2E auth user. Response: $CREATED"
            exit 1
          fi

          psql "$SUPABASE_TEST_DB_URL" -v ON_ERROR_STOP=1 -q \
            -c "select public.orion_add_member('$EMAIL', 'E2E', 'owner');"

          echo "SUPABASE_TEST_EMAIL=$EMAIL" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - run: npm run test:e2e
      - name: Stress stale Realtime revision regression 20x
        run: npx playwright test tests/e2e/realtime-revision.supabase.spec.ts --project=chromium --repeat-each=20
      - name: Upload Playwright report and failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: supabase stop
